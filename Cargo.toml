[workspace]
resolver = "3"
members = [
    "crates/alestia-util",
    "crates/alestia-math",
    "crates/alestia-astro",
    "crates/alestia-ephem",
    "crates/alestia-model",
    "crates/alestia-image",
    "crates/alestia-font",
    "crates/alestia-engine",
    "crates/alestia-render",
    "crates/alestia-script",
    "crates/alestia-core",
    "crates/alestia-app",
    "crates/alestia-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"

[workspace.dependencies]
proptest = "1"

alestia-util = { version = "0.1.0", path = "crates/alestia-util" }
alestia-math = { version = "0.1.0", path = "crates/alestia-math" }
alestia-astro = { version = "0.1.0", path = "crates/alestia-astro" }
alestia-ephem = { version = "0.1.0", path = "crates/alestia-ephem" }
alestia-model = { version = "0.1.0", path = "crates/alestia-model" }
alestia-image = { version = "0.1.0", path = "crates/alestia-image" }
alestia-font = { version = "0.1.0", path = "crates/alestia-font" }
alestia-engine = { version = "0.1.0", path = "crates/alestia-engine" }
alestia-render = { version = "0.1.0", path = "crates/alestia-render" }
alestia-script = { version = "0.1.0", path = "crates/alestia-script" }
alestia-core = { version = "0.1.0", path = "crates/alestia-core" }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
