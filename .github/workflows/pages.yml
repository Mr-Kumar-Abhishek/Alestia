name: Alestia Pages (WASM)

on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo
      - name: Enforce strict TOML formatting and linting
        shell: bash
        run: |
          taplo fmt --check || (taplo fmt --diff && exit 1)
          taplo lint
      - name: Enforce Tier-1 unsafe_code forbid policy
        shell: bash
        run: |
          for crate in alestia-util alestia-math alestia-astro alestia-model alestia-image alestia-font alestia-engine alestia-core; do
            head -n 1 "crates/${crate}/src/lib.rs" | grep -qx '#!\[forbid(unsafe_code)\]'
          done
          head -n 1 "crates/alestia-tools/src/main.rs" | grep -qx '#!\[forbid(unsafe_code)\]'
      - name: Enforce rustfmt across workspace
        run: cargo fmt --all -- --check
      - name: Enforce Clippy pedantic & strict lints (debug targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Enforce Clippy pedantic & strict lints (release targets)
        run: cargo clippy --workspace --release --all-targets -- -D warnings
      - name: Enforce Clippy pedantic & strict lints (WASM debug targets)
        run: cargo clippy --workspace --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Enforce Clippy pedantic & strict lints (WASM release targets)
        run: cargo clippy --workspace --lib --release --target wasm32-unknown-unknown -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  deploy-gh-pages:
    needs: lint-and-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build alestia-web WASM (release)
        run: cargo build -p alestia-web --target wasm32-unknown-unknown --release
      - name: Resolve wasm-bindgen version from Cargo.lock
        id: wb
        shell: bash
        run: |
          WB_VER=$(awk '/^name = "wasm-bindgen"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          test -n "${WB_VER}"
          echo "version=${WB_VER}" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}
      - name: Build Rust API docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
      - name: Stage static site and WASM package
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/pkg site/api
          cp -r web/* site/
          cp LICENSE site/LICENSE
          wasm-bindgen --target web --out-dir site/pkg target/wasm32-unknown-unknown/release/alestia_web.wasm
          cp -r target/doc/* site/api/
          touch site/.nojekyll
          test -s site/index.html
          test -s site/pkg/alestia_web.js
          test -s site/pkg/alestia_web_bg.wasm
      - name: Deploy site to gh-pages branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Alestia WASM & API docs (${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
