name: Alestia Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (when triggered manually)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo
      - name: Enforce strict TOML formatting and linting
        shell: bash
        run: |
          taplo fmt --check || (taplo fmt --diff && exit 1)
          taplo lint
      - name: Enforce Tier-1 unsafe_code forbid policy
        shell: bash
        run: |
          for crate in alestia-util alestia-math alestia-astro alestia-model alestia-image alestia-font alestia-engine alestia-core; do
            head -n 1 "crates/${crate}/src/lib.rs" | grep -qx '#!\[forbid(unsafe_code)\]'
          done
          head -n 1 "crates/alestia-tools/src/main.rs" | grep -qx '#!\[forbid(unsafe_code)\]'
      - name: Enforce rustfmt across workspace
        run: cargo fmt --all -- --check
      - name: Enforce Clippy pedantic & strict lints (debug targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Enforce Clippy pedantic & strict lints (release targets)
        run: cargo clippy --workspace --release --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  build-release:
    needs: lint-and-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run workspace test suite (release build)
        run: cargo test --workspace --release --target ${{ matrix.target }}
      - name: Build workspace binaries (release build)
        run: cargo build --workspace --bins --release --target ${{ matrix.target }}
      - name: Package release archive
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          STAGE="alestia-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/alestia-app${{ matrix.ext }}" "dist/${STAGE}/"
          cp "target/${{ matrix.target }}/release/alestia-tools${{ matrix.ext }}" "dist/${STAGE}/"
          cp LICENSE README.md "dist/${STAGE}/"
          mkdir -p artifacts
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "../artifacts/${STAGE}.zip" "${STAGE}")
          else
            tar -C dist -czf "artifacts/${STAGE}.tar.gz" "${STAGE}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*

  publish-release:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          PRERELEASE_FLAG=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" ./* \
            --title "Alestia ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${PRERELEASE_FLAG}
