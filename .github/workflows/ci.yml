name: Alestia CI

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build debug workspace targets
        run: cargo build --workspace --all-targets --profile dev
      - name: Run unit and integration tests (debug build)
        run: cargo nextest run --workspace --cargo-profile dev --no-fail-fast
      - name: Run doc-tests (debug build)
        run: cargo test --doc --workspace --profile dev

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov, nextest
      - run: cargo llvm-cov nextest --workspace --ignore-filename-regex 'main\.rs' --lcov --output-path lcov.info
      - name: Enforce minimum workspace coverage (85%)
        run: cargo llvm-cov report --ignore-filename-regex 'main\.rs' --fail-under-lines 85
