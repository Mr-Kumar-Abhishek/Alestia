name: Alestia CI

on:
  pull_request:
  push:
    branches: [master, debug]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo
      - name: Enforce strict TOML formatting and linting
        shell: bash
        run: |
          taplo fmt --check || (taplo fmt --diff && exit 1)
          taplo lint
      - name: Enforce Tier-1 unsafe_code forbid policy
        shell: bash
        run: |
          for crate in alestia-util alestia-math alestia-astro alestia-model alestia-image alestia-font alestia-engine alestia-core; do
            head -n 1 "crates/${crate}/src/lib.rs" | grep -qx '#!\[forbid(unsafe_code)\]'
          done
          head -n 1 "crates/alestia-tools/src/main.rs" | grep -qx '#!\[forbid(unsafe_code)\]'
      - name: Enforce rustfmt across workspace
        run: cargo fmt --all -- --check
      - name: Enforce Clippy pedantic & strict lints (debug targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Enforce Clippy pedantic & strict lints (spice feature)
        run: cargo clippy -p alestia-ephem --features spice --all-targets -- -D warnings
      - name: Enforce Clippy pedantic & strict lints (release targets)
        run: cargo clippy --workspace --release --all-targets -- -D warnings
      - name: Enforce Clippy pedantic & strict lints (WASM debug targets)
        run: cargo clippy --workspace --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Enforce Clippy pedantic & strict lints (WASM release targets)
        run: cargo clippy --workspace --lib --release --target wasm32-unknown-unknown -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  wasm-build:
    needs: lint-and-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build workspace libraries for wasm32-unknown-unknown (debug)
        run: cargo build --workspace --lib --target wasm32-unknown-unknown --profile dev
      - name: Resolve wasm-bindgen version from Cargo.lock
        id: wb
        shell: bash
        run: |
          WB_VER=$(awk '/^name = "wasm-bindgen"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          test -n "${WB_VER}"
          echo "version=${WB_VER}" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}
      - name: Generate and verify WebAssembly JS bindings
        shell: bash
        run: |
          wasm-bindgen --target web --out-dir dist-wasm/pkg target/wasm32-unknown-unknown/debug/alestia_web.wasm
          test -s dist-wasm/pkg/alestia_web.js
          test -s dist-wasm/pkg/alestia_web_bg.wasm

  test-matrix:
    needs: lint-and-policy
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build debug workspace targets
        run: cargo build --workspace --all-targets --profile dev
      - name: Run unit and integration tests (debug build)
        run: cargo nextest run --workspace --cargo-profile dev --no-fail-fast
      - name: Run unit tests for alestia-ephem with spice feature
        run: cargo nextest run -p alestia-ephem --features spice --cargo-profile dev --no-fail-fast
      - name: Run doc-tests (debug build)
        run: cargo test --doc --workspace --profile dev

  coverage:
    needs: lint-and-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov, nextest
      - run: cargo llvm-cov nextest --workspace --ignore-filename-regex 'main\.rs' --lcov --output-path lcov.info
      - name: Enforce minimum workspace coverage (85%)
        run: cargo llvm-cov report --ignore-filename-regex 'main\.rs' --fail-under-lines 85
